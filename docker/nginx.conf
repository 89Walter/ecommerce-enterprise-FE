server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Non rivela la versione di nginx negli header e nelle pagine di errore.
    server_tokens off;

    # Gli header di sicurezza (CSP, X-Frame-Options, …) sono generati all'avvio da 40-generate-env-js.sh.
    # Vanno inclusi in ogni location: se una location ha un proprio add_header, quelli del blocco server non valgono più.

    # Configurazione runtime, pagina principale e frame del check-sso: sempre aggiornati.
    # Deve precedere la regola sui .js: tra le location regex nginx usa la prima che corrisponde.
    location ~ ^/(env\.js|index\.html|silent-check-sso\.(html|js))$ {
        include /etc/nginx/security/headers.conf;
        add_header Cache-Control "no-cache";
    }

    # File con hash nel nome: non cambiano mai, possono restare in cache a lungo.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        include /etc/nginx/security/headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page application: le rotte di Angular (/orders/12, /admin, …) restituiscono index.html.
    location / {
        include /etc/nginx/security/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
